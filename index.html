<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barretos - Ingressos e Camping</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="barretos-header">
        <div class="header-overlay">
            <div class="header-content">
                <div class="logo-area">
                    <img src="./logo_barretos_2026.webp" alt="Logo Barretos" style="width: 20%; border-radius: 8px;">
                </div>
                <nav class="header-nav"></nav>
                <a href="#formBarretos" class="btn-tickets">Garantir Tickets</a>
            </div>
        </div>
    </header>

    <div class="container">
        <h2>Preencha com seus dados:</h2>

        <form id="formBarretos">
            <div class="form-group">
                <label for="nomeCompleto">Nome Completo:</label>
                <input type="text" id="nomeCompleto" required>
            </div>

            <div class="form-group">
                <label for="dataNascimento">Data de Nascimento:</label>
                <input type="date" id="dataNascimento" required>
            </div>

            <div class="form-group">
                <label for="sexo">Sexo:</label>
                <select id="sexo" required>
                    <option value="M">Masculino</option>
                    <option value="F">Feminino</option>
                    <option value="O">Outro</option>
                </select>
            </div>

            <div class="form-group">
                <label for="cidadeOrigem">Cidade de onde virá ao rodeio:</label>
                <input type="text" id="cidadeOrigem" required>
            </div>

            <div class="form-group">
                <label for="setorShow">Setor do Show:</label>
                <img src="./mapa_arena.webp" alt="Mapa de Setores da Arena Barretos" style="width: 100%; border-radius: 8px;">
                <select id="setorShow">
                    <option value="PISTA">Pista - R$ 200,00/dia</option>
                    <option value="PISTA_PRIME">Pista Prime (Frente ao Palco) - R$ 590,00/dia</option>
                    <option value="PISTA_GOLD">Pista Gold (Menores de 18 anos) - R$ 789,00/dia</option>
                    <option value="ARQUIBANCADA_SUP">Arquibancada Superior (Esq/Dir) - R$ 235,00/dia</option>
                    <option value="ARQUIBANCADA_INF">Arquibancada Inferior (Esq/Dir) - R$ 350,00/dia</option>
                    <option value="BACKSTAGE">Backstage - R$ 900,00/dia</option>
                    <option value="CAMAROTE_BRAHMA">Camarote Brahma - R$ 1.300,00/dia</option>
                </select>
            </div>

            <div class="form-group">
                <label for="modalidadeIngresso">Modalidade:</label>
                <select id="modalidadeIngresso">
                    <option value="DIA">Ingresso para 1 Dia</option>
                    <option value="COMBO">Combo Completo (10 Dias)</option>
                </select>
            </div>

            <div class="form-group">
                <label>
                    <input type="checkbox" id="querCamping"> Deseja Hospedagem no Camping?
                </label>
            </div>

            <div id="secaoCamping" class="hidden">
                <div class="form-group">
                    <label for="tamanhoBarraca">Tamanho da Barraca:</label>
                    <select id="tamanhoBarraca">
                        <option value="P">Pequena (até 2 pessoas) - R$ 80,00</option>
                        <option value="M">Média (3 a 4 pessoas) - R$ 140,00</option>
                        <option value="G">Grande (5+ pessoas) - R$ 200,00</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="qtdPessoasCamping">Quantidade de Pessoas na Barraca:</label>
                    <input type="number" id="qtdPessoasCamping" min="1" value="1">
                </div>
            </div>

            <div class="total-box">
                Total Estimado: R$ <span id="valorTotal">200,00</span>
            </div>

            <button type="submit">Finalizar Inscrição</button>
        </form>

        <div style="margin-top: 30px; border-top: 2px dashed #ccc; padding-top: 20px;">
            <h3 style="color: #8b0000; text-align: center; margin-bottom: 15px;">Participantes Confirmados</h3>
            <div id="listaConfirmados"></div>
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
